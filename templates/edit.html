
{% extends "base.html" %}

{% block content %}

<h1>Edit Expense</h1>

<form method="POST">

    <label>Date
        <input type="date" name="date"
               value="{{ expense['date'] }}" required>
    </label>

    <label>Category
        <select name="category" required>
            {% for cat in ['Food', 'Transport', 'Entertainment',
                           'Utilities', 'Health', 'Bills', 'Other'] %}
                <option value="{{ cat }}"
                    {% if expense['category'] == cat %}selected{% endif %}>
                    {{ cat }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label>Amount (₹)
        <input type="number" name="amount"
               min="0.1" step="0.01"
               value="{{ expense['amount'] }}" required>
    </label>

    <button type="submit">Save Changes</button>

    <a href="{{ url_for('home') }}">Cancel</a>

</form>

{% endblock %}
