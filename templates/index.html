{% extends "base.html" %}
{% block content %}
<h1>My Expenses</h1>
<table>
    <tr>
        <th>Date</th>
        <th>Category</th>
        <th>Amount</th>
    </tr>
    {%  for e in expenses %}
    <tr >
        <td>{{e.date}}</td>
        <td>{{e.category}}</td>
        <td>{{e.amount}}</td>
        <td>
    
            <a href="{{ url_for('edit', id=e['id']) }}">
                <button type="button">Edit</button>
            </a>

    
        <form method="post"
            action="{{ url_for('delete', id=e['id']) }}"
            style="display:inline;">

          <button type="submit" class="delete_button">
             Delete
          </button>

        </form>
        </td>
    </tr>
    {% endfor %}
    <tr>
        <td colspan="2"><strong>Total</strong></td>
        <td><strong>{{total}}</strong></td>
    </tr>
</table>
{% endblock %}
