{% extends "base.html" %}

{% block content %}
<h1>Login</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="post">
  <label>Username
    <input type="text" name="username" required>
  </label>

  <label>Password
    <input type="password" name="password" required>
  </label>

  <button type="submit">Log in</button>
</form>
{% endblock %}
